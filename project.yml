name: PromptPolish
options:
  bundleIdPrefix: local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 1.0.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    DEVELOPMENT_TEAM: 6ALXRXJXN6
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  PromptPolish:
    type: application
    platform: macOS
    sources:
      - PromptPolish
    dependencies:
      - package: KeyboardShortcuts
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: PromptPolish/Resources/Info.plist
      properties:
        CFBundleDisplayName: PromptPolish
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.promptpolish
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
  PromptPolishTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PromptPolishTests
    dependencies:
      - target: PromptPolish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.promptpolish.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PromptPolish.app/Contents/MacOS/PromptPolish"
schemes:
  PromptPolish:
    build:
      targets:
        PromptPolish: all
        PromptPolishTests: [test]
    test:
      targets:
        - PromptPolishTests
