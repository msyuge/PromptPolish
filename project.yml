name: PromptPolish
options:
  bundleIdPrefix: com.alekseimaksimov
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.32.3
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 1.0.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    DEVELOPMENT_TEAM: 6ALXRXJXN6
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  PromptPolish:
    type: application
    platform: macOS
    sources:
      - PromptPolish
    dependencies:
      - package: KeyboardShortcuts
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: PromptPolish/Resources/Info.plist
      properties:
        CFBundleDisplayName: PromptPolish
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Aleksei Maksimov"
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseimaksimov.promptpolish
        ENABLE_APP_SANDBOX: NO
        # Hardened Runtime обязателен для нотаризации; Accessibility и CGEvent под ним работают без entitlements.
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Распространяемая сборка подписывается Developer ID; Debug остаётся на Apple Development,
        # чтобы разрешение Accessibility не сбрасывалось при разработке.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
  PromptPolishTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PromptPolishTests
    dependencies:
      - target: PromptPolish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekseimaksimov.promptpolish.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PromptPolish.app/Contents/MacOS/PromptPolish"
schemes:
  PromptPolish:
    build:
      targets:
        PromptPolish: all
        PromptPolishTests: [test]
    test:
      targets:
        - PromptPolishTests
